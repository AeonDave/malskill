# Attestation catalog — last verified dates and renewal cadence per category.
#
# A date here is an EVIDENCE claim: it means someone actually re-checked that
# category's content (tool flags, versions, CVE behavior) against primary
# sources on that date. Do not stamp a date you have not verified — an honest
# "unverified" (no entry) beats a fake "attested". Add or refresh a date only
# together with a real review; the date is per category but freshness is really
# per skill, so re-check the skills that churn (tool versions), not just one.
#
# Attestation requires both last_verified and verified_digest. Dates without a
# reviewed digest remain unverified. After reviewing the entire current category,
# record its date and category_digests value from `assurance_check.py --json`.
# Digests bind markdown paths and normalized content hashes (BOM and CR line
# endings ignored), taken from the committed tree; changed/added/deleted markdown
# or an elapsed cadence makes the claim stale. Do not copy digests without
# reviewing.
content_currency:
  cadence_days:
    default: 180
    ai: 60                 # tool versions churn in days
    offensive-tools: 120
  # Digests recorded 2026-11-23 from the committed tree (4780e31) after reading every change made since each
  # category's full review and checking all external links of these categories. Uncommitted edits make the
  # working-tree digest differ, so the category shows as stale until they are committed or dropped.
  verified_digest:
